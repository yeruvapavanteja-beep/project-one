<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — AgriSmart Connect</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<div class="auth-shell" style="grid-template-columns: 1fr;">
  <div class="auth-form-panel">
    <div class="auth-form-card">
      <a href="index.html" class="brand" style="margin-bottom:var(--space-md);"><span class="brand-mark">A</span><span class="brand-name">AgriSmart Connect</span></a>
      <h3>Reset your password</h3>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      <form id="forgotForm">
        <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>
      <p class="auth-footer-text"><a href="login.html">← Back to log in</a></p>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = e.target.email.value;
  try {
    await Api.post('/auth/forgot-password', { email });
    showToast('If an account exists for that email, a reset link has been sent.', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
});
</script>
</body>
</html>
